name: Mapbox Offline POC (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - test/mapbox-offline-poc
    paths:
      - 'experiments/mapbox_poc/**'
      - '.github/workflows/mapbox-poc-android.yml'

permissions:
  contents: read

jobs:
  build-mapbox-poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/mapbox_poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name mapbox_offline_poc .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib

      - name: Build debug APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto MAPBOX_ACCESS_TOKEN. No se generará un APK que abra el mapa sin credenciales."
            exit 1
          fi
          flutter build apk --debug --dart-define=ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapbox-offline-poc-debug-apk
          path: experiments/mapbox_poc/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
