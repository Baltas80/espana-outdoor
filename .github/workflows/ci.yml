name: CI

concurrency:
  group: espana-outdoors-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gateway:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/source-gateway/go.mod
          cache-dependency-path: services/source-gateway/go.sum
      - name: Test Source Gateway
        working-directory: services/source-gateway
        run: go test ./...

  flutter:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate mobile platform projects
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "$RUNNER_TEMP/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "$RUNNER_TEMP/widget_test.dart"; fi
          flutter create . --platforms=android,ios --org com.espanaoutdoors
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          if [[ -f "$RUNNER_TEMP/analysis_options.yaml" ]]; then cp "$RUNNER_TEMP/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "$RUNNER_TEMP/widget_test.dart" ]]; then cp "$RUNNER_TEMP/widget_test.dart" test/widget_test.dart; fi
      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android
      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android
      - name: Verify CI build profile
        run: python3 tool/verify_build_profile.py --profile ci
      - name: Dependencies
        run: flutter pub get
      - name: Map provider guard
        run: dart run tool/check_map_provider_usage.dart
      - name: Live data provider guard
        run: dart run tool/check_live_data_provider_usage.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Focused routing/offline/safety tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart
          test/remote_source_gateway_test.dart
          test/gateway_weather_service_test.dart
          test/source_gateway_config_test.dart
      - name: Full test suite
        run: flutter test --coverage --concurrency=1
      - name: Android release build
        run: |
          flutter build apk --release --dart-define=APP_ENV=ci
          flutter build appbundle --release --dart-define=APP_ENV=ci
      - name: Verify Android release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          python3 tool/verify_android_release.py --apk "$apk" --aab "$aab"
      - name: Generate Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          {
            echo "profile=ci"
            echo "app_version=${app_version}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=${flutter_version}"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "aab_file=$(basename "$aab")"
            echo "aab_size_bytes=$(stat -c '%s' "$aab")"
            echo "aab_sha256=$(sha256sum "$aab" | cut -d ' ' -f1)"
          } > build/android-release-manifest.txt
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/android-release-manifest.txt
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage
          path: coverage/lcov.info

  ios-build:
    runs-on: macos-latest
    env:
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate iOS project
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "$RUNNER_TEMP/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "$RUNNER_TEMP/widget_test.dart"; fi
          flutter create . --platforms=ios --org com.espanaoutdoors
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          if [[ -f "$RUNNER_TEMP/analysis_options.yaml" ]]; then cp "$RUNNER_TEMP/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "$RUNNER_TEMP/widget_test.dart" ]]; then cp "$RUNNER_TEMP/widget_test.dart" test/widget_test.dart; fi
      - name: Apply iOS native configuration
        run: python3 tool/configure_mobile_native.py --platform ios
      - name: Verify iOS native configuration
        run: python3 tool/verify_mobile_native.py --platform ios
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build configured iOS candidate
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=ci
