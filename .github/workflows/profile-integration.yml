name: Shared profile integration

on:
  push:
    branches: [feature/profile-registration-20261024]
    paths:
      - 'services/user-profile/**'
      - 'lib/features/profile/**'
      - 'test/features/profile/**'
      - 'site/cuenta.html'
      - 'site/mi-perfil.html'
      - 'site/mi-perfil.js'
      - 'site/account.js'
      - 'site/profile-config.js'
      - 'site/_headers'
      - 'database/migrations/**'
      - 'site/app.js'
      - 'site/styles.css'
      - 'infra/docker-compose.yml'
      - '.github/workflows/profile-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/user-profile/**'
      - 'lib/features/profile/**'
      - 'test/features/profile/**'
      - 'site/cuenta.html'
      - 'site/mi-perfil.html'
      - 'site/mi-perfil.js'
      - 'site/account.js'
      - 'site/profile-config.js'
      - 'site/_headers'
      - 'database/migrations/**'
      - 'site/app.js'
      - 'site/styles.css'
      - 'infra/docker-compose.yml'
      - '.github/workflows/profile-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/user-profile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/user-profile/go.mod
          cache-dependency-path: services/user-profile/go.sum
      - name: Verify locked dependencies
        run: go mod verify
      - name: Test API validation and request contracts
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build API
        run: go build ./...

  android-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter application
        run: flutter analyze --no-fatal-infos
      - name: Test shared profile API client
        run: flutter test test/features/profile/user_profile_api_test.dart

  web-account:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'
      - name: Validate browser module syntax
        run: node --input-type=module --check < site/account.js

      - name: Validate personal profile module syntax
        run: node --input-type=module --check < site/mi-perfil.js
      - name: Validate public profile page assets
        shell: bash
        run: |
          set -euo pipefail
          test -s site/cuenta.html
          test -s site/profile-config.js
          test -s site/account.js
          grep -q 'dataApiUrl' site/profile-config.js
          grep -q "'/user_profiles?on_conflict=user_id'" site/account.js
          grep -q 'user_profiles' database/migrations/001_neon_auth_user_profiles.sql
          grep -q '@neondatabase/auth' site/account.js
          grep -q 'createAuthClient(config.authUrl)' site/account.js
          grep -q 'avatar_data' database/migrations/001_neon_auth_user_profiles.sql
          grep -q 'data-account-avatar-file' site/cuenta.html
          grep -q 'avatar_data: body.avatarData' site/account.js
          test -s site/mi-perfil.html
          test -s site/mi-perfil.js
          grep -q 'data-profile-content' site/mi-perfil.html
          grep -q 'data-profile-photo-input' site/mi-perfil.html
          grep -q 'optimizeProfileImage' site/mi-perfil.js
          grep -q 'auth.getSession()' site/mi-perfil.js
