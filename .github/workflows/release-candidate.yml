name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: production
  MAP_PMTILES_URL: ${{ secrets.MAP_PMTILES_URL }}
  VALHALLA_BASE_URL: ${{ secrets.VALHALLA_BASE_URL }}
  SOURCE_GATEWAY_BASE_URL: ${{ secrets.SOURCE_GATEWAY_BASE_URL }}
  OFFLINE_CATALOG_URL: ${{ secrets.OFFLINE_CATALOG_URL }}
  RESCUE_LINK_BASE_URL: ${{ secrets.RESCUE_LINK_BASE_URL }}
  OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
  OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
  OIDC_REDIRECT_URI: ${{ vars.OIDC_REDIRECT_URI }}
  PROFILE_API_BASE_URL: ${{ vars.PROFILE_API_BASE_URL }}
  MAP_ATTRIBUTION: ${{ vars.MAP_ATTRIBUTION }}

jobs:
  android-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "${RUNNER_TEMP}/pubspec.yaml"
          cp lib/main.dart "${RUNNER_TEMP}/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "${RUNNER_TEMP}/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "${RUNNER_TEMP}/widget_test.dart"; fi
          flutter --version
          flutter create . --platforms=android --org com.espanaoutdoors --overwrite
          cp "${RUNNER_TEMP}/pubspec.yaml" pubspec.yaml
          cp "${RUNNER_TEMP}/main.dart" lib/main.dart
          if [[ -f "${RUNNER_TEMP}/analysis_options.yaml" ]]; then cp "${RUNNER_TEMP}/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "${RUNNER_TEMP}/widget_test.dart" ]]; then cp "${RUNNER_TEMP}/widget_test.dart" test/widget_test.dart; fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle

      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in MAP_PMTILES_URL VALHALLA_BASE_URL OFFLINE_CATALOG_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL PROFILE_API_BASE_URL; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
            if [[ "$value" != https://* ]]; then
              echo "$name must use HTTPS"
              exit 1
            fi
            case "$value" in
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*::1*|*.local/*|*.local)
                echo "$name contains a placeholder or local endpoint: $value"
                exit 1
                ;;
            esac
          done
          for name in OIDC_ISSUER OIDC_CLIENT_ID OIDC_REDIRECT_URI; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required repository variable: $name"
              exit 1
            fi
          done
          case "$OIDC_ISSUER" in https://*) ;; *) echo "OIDC_ISSUER must use HTTPS"; exit 1;; esac

      - name: Verify production build profile
        run: python3 tool/verify_build_profile.py --profile production


      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage

      - name: Build signed-by-platform-ready Android artifacts
        run: |
          DART_DEFINES=(
            --dart-define=APP_ENV="$APP_ENV"
            --dart-define=MAP_PMTILES_URL="$MAP_PMTILES_URL"
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL"
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL"
            --dart-define=OFFLINE_CATALOG_URL="$OFFLINE_CATALOG_URL"
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL"
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER"
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID"
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"
            --dart-define=PROFILE_API_BASE_URL="$PROFILE_API_BASE_URL"
            --dart-define=MAP_ATTRIBUTION="$MAP_ATTRIBUTION"
          )
          flutter build apk --release "${DART_DEFINES[@]}"
          flutter build appbundle --release "${DART_DEFINES[@]}"

      - name: Verify Android release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          python3 tool/verify_android_release.py --apk "$apk" --aab "$aab"

      - name: Generate Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          {
            echo "profile=production"
            echo "app_version=${app_version}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=${flutter_version}"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "aab_file=$(basename "$aab")"
            echo "aab_size_bytes=$(stat -c '%s' "$aab")"
            echo "aab_sha256=$(sha256sum "$aab" | cut -d ' ' -f1)"
          } > build/android-release-manifest.txt

      - name: Upload Android candidate
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-release-candidate
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/android-release-manifest.txt

  ios-release-candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in MAP_PMTILES_URL VALHALLA_BASE_URL OFFLINE_CATALOG_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
            if [[ "$value" != https://* ]]; then
              echo "$name must use HTTPS"
              exit 1
            fi
            case "$value" in
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*::1*|*.local/*|*.local)
                echo "$name contains a placeholder or local endpoint: $value"
                exit 1
                ;;
            esac
          done

      - name: Verify production build profile
        run: python3 tool/verify_build_profile.py --profile production


      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.espanaoutdoors

      - name: Apply iOS native configuration
        run: python3 tool/configure_mobile_native.py --platform ios

      - name: Verify iOS native configuration
        run: python3 tool/verify_mobile_native.py --platform ios

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build configured iOS candidate
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAP_PMTILES_URL="$MAP_PMTILES_URL" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=OFFLINE_CATALOG_URL="$OFFLINE_CATALOG_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI" \
            --dart-define=PROFILE_API_BASE_URL="$PROFILE_API_BASE_URL" \
            --dart-define=MAP_ATTRIBUTION="$MAP_ATTRIBUTION"
