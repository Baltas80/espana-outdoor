name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: production
  MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
  VALHALLA_BASE_URL: ${{ secrets.VALHALLA_BASE_URL }}
  SOURCE_GATEWAY_BASE_URL: ${{ secrets.SOURCE_GATEWAY_BASE_URL }}
  RESCUE_LINK_BASE_URL: ${{ secrets.RESCUE_LINK_BASE_URL }}

jobs:
  android-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          certificate_sha256="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint."
            exit 1
          fi
          store_file="$RUNNER_TEMP/espana-outdoor-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          chmod 600 "$store_file"
          test -s "$store_file"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$store_file"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
            echo "ANDROID_RELEASE_CERT_SHA256=$certificate_sha256"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "${RUNNER_TEMP}/pubspec.yaml"
          cp lib/main.dart "${RUNNER_TEMP}/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "${RUNNER_TEMP}/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "${RUNNER_TEMP}/widget_test.dart"; fi
          flutter --version
          flutter create . --platforms=android --org com.espanaoutdoors --overwrite
          cp "${RUNNER_TEMP}/pubspec.yaml" pubspec.yaml
          cp "${RUNNER_TEMP}/main.dart" lib/main.dart
          if [[ -f "${RUNNER_TEMP}/analysis_options.yaml" ]]; then cp "${RUNNER_TEMP}/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "${RUNNER_TEMP}/widget_test.dart" ]]; then cp "${RUNNER_TEMP}/widget_test.dart" test/widget_test.dart; fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle

      - name: Check production endpoints and Mapbox token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" ]]; then echo "Missing required secret: MAPBOX_ACCESS_TOKEN"; exit 1; fi
          for name in VALHALLA_BASE_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
            if [[ "$value" != https://* ]]; then
              echo "$name must use HTTPS"
              exit 1
            fi
            case "$value" in
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*::1*|*.local/*|*.local)
                echo "$name contains a placeholder or local endpoint: $value"
                exit 1
                ;;
            esac
          done

      - name: Verify production build profile
        run: python3 tool/verify_build_profile.py --profile production


      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage

      - name: Build Android release artifacts with upload key
        run: |
          DART_DEFINES=(
            --dart-define=APP_ENV="$APP_ENV"
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL"
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL"
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL"
          )
          flutter build apk --release "${DART_DEFINES[@]}"
          flutter build appbundle --release "${DART_DEFINES[@]}"

      - name: Verify Android release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          python3 tool/verify_android_release.py --apk "$apk" --aab "$aab" \
            --expected-cert-sha256 "$ANDROID_RELEASE_CERT_SHA256"

      - name: Generate Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          {
            echo "profile=production"
            echo "app_version=${app_version}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=${flutter_version}"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "aab_file=$(basename "$aab")"
            echo "aab_size_bytes=$(stat -c '%s' "$aab")"
            echo "aab_sha256=$(sha256sum "$aab" | cut -d ' ' -f1)"
            echo "signing_cert_sha256=$ANDROID_RELEASE_CERT_SHA256"
          } > build/android-release-manifest.txt

      - name: Upload Android candidate
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-release-candidate
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/android-release-manifest.txt

  ios-release-candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check production endpoints and Mapbox token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" ]]; then echo "Missing required secret: MAPBOX_ACCESS_TOKEN"; exit 1; fi
          for name in VALHALLA_BASE_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required production secret: $name"
              exit 1
            fi
            if [[ "$value" != https://* ]]; then
              echo "$name must use HTTPS"
              exit 1
            fi
            case "$value" in
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*::1*|*.local/*|*.local)
                echo "$name contains a placeholder or local endpoint: $value"
                exit 1
                ;;
            esac
          done

      - name: Verify production build profile
        run: python3 tool/verify_build_profile.py --profile production


      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.espanaoutdoors

      - name: Apply iOS native configuration
        run: python3 tool/configure_mobile_native.py --platform ios

      - name: Verify iOS native configuration
        run: python3 tool/verify_mobile_native.py --platform ios

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build configured iOS candidate
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \

