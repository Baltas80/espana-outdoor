name: Profile API CI

on:
  push:
    paths:
      - "services/profile-api/**"
      - "infra/postgres/migrations/002-user-profiles.sql"
      - ".github/workflows/profile-api-ci.yml"
  pull_request:
    paths:
      - "services/profile-api/**"
      - "infra/postgres/migrations/002-user-profiles.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/profile-api/go.mod
          cache-dependency-path: services/profile-api/go.mod
      - name: Download dependencies
        working-directory: services/profile-api
        run: go mod download
      - name: Unit tests
        working-directory: services/profile-api
        run: go test ./...
