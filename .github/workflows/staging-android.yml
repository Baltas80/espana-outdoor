name: Android staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'integration_test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'integration_test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

concurrency:
  group: android-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: staging
  MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect

jobs:
  android-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"; test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done
      - name: Check Mapbox Navigation Maven token
        shell: bash
        run: test -n "${MAPBOX_DOWNLOADS_TOKEN:-}" || { echo "Missing MAPBOX_DOWNLOADS_TOKEN (Downloads:Read)."; exit 1; }
      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify committed Android native project
        run: python3 tool/verify_mobile_native.py --platform android
      - name: Install pinned Android NDK r27d
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set}}"
          sdkmanager_path="$(command -v sdkmanager || find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$sdk_root" --install "ndk;27.3.13750724"
          test -f "$sdk_root/ndk/27.3.13750724/source.properties"
      - name: Dependencies
        id: pub_get
        run: flutter pub get
      - name: Export resolved Pub lockfile for dependency audit
        if: steps.pub_get.outcome == 'success'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: resolved-pubspec-lock-${{ github.run_id }}
          path: pubspec.lock
          if-no-files-found: error
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage
      - name: Build Android staging APK
        if: always()
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto MAPBOX_ACCESS_TOKEN; no se puede inicializar el mapa."
            exit 1
          fi
          flutter pub get
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"
      - name: Diagnose direct Mapbox Directions HTTP response
        continue-on-error: true
        shell: bash
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAPBOX_ACCESS_TOKEN"
          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          http_status="$(curl --silent --show-error --get \
            --output "$body_file" \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            --data-urlencode 'geometries=polyline6' \
            --data-urlencode 'overview=full' \
            --data-urlencode 'steps=true' \
            --data-urlencode 'language=es' \
            --data-urlencode "access_token=$MAPBOX_ACCESS_TOKEN" \
            'https://api.mapbox.com/directions/v5/mapbox/walking/-4.7794,37.8882;-4.7700,37.8900')"
          python3 - "$body_file" "$headers_file" "$http_status" <<'PY'
          import json
          import pathlib
          import sys

          body_path, headers_path, status = sys.argv[1:]
          raw = pathlib.Path(body_path).read_text(encoding="utf-8", errors="replace")
          headers = pathlib.Path(headers_path).read_text(encoding="utf-8", errors="replace")
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              payload = {}
          request_id = next(
              (line.split(":", 1)[1].strip() for line in headers.splitlines()
               if line.lower().startswith(("x-request-id:", "x-mapbox-request-id:"))),
              "<not-provided>",
          )
          print(f"HTTP_STATUS={status}")
          print(f"MAPBOX_CODE={payload.get('code', '<not-json-or-absent>')}")
          message = " ".join(str(payload.get("message", "")).split())
          print(f"MAPBOX_MESSAGE={message[:500] if message else '<none>'}")
          print(f"ROUTES_COUNT={len(payload.get('routes', [])) if isinstance(payload.get('routes'), list) else 0}")
          print(f"MAPBOX_REQUEST_ID={request_id}")
          PY
          rm -f "$body_file" "$headers_file"
      - name: Verify APK
        if: always()
        run: |
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 tool/verify_android_release.py --apk "$apk"
      - name: Upload Android staging APK
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-staging-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        id: kvm_setup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'ERROR: /dev/kvm is not available on this runner.'
            exit 1
          fi
      - name: Android online and offline route integration
        id: android_route_integration
        if: success() && steps.kvm_setup.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            original_wifi="$(adb shell settings get global wifi_on | tr -d '\r\n')"
            airplane_enabled=0
            restore_network() {
              if [[ "$airplane_enabled" = "1" ]]; then
                adb shell cmd connectivity airplane-mode disable || {
                  adb shell settings put global airplane_mode_on 0
                  adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state false >/dev/null
                }
                if [[ "$original_wifi" = "1" ]]; then adb shell svc wifi enable; else adb shell svc wifi disable; fi
              fi
            }
            trap restore_network EXIT

            flutter test -d emulator-5554 \
              --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
              --dart-define=ROUTE_TEST_MODE=online_and_download \
              integration_test/mapbox_android_live_route_test.dart

            adb shell cmd connectivity airplane-mode enable || {
              adb shell settings put global airplane_mode_on 1
              adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null
            }
            airplane_enabled=1
            adb shell svc wifi disable
            sleep 3
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r\n')" = "1"
            test "$(adb shell settings get global wifi_on | tr -d '\r\n')" != "1"
            adb shell am force-stop com.espanaoutdoors.espana_outdoors

            flutter test -d emulator-5554 \
              --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
              --dart-define=ROUTE_TEST_MODE=offline \
              integration_test/mapbox_android_live_route_test.dart

            adb shell logcat -d > "$RUNNER_TEMP/espana-outdoor-route-logcat.txt"
            adb shell cmd connectivity airplane-mode disable || true
            airplane_enabled=0
            if [[ "$original_wifi" = "1" ]]; then adb shell svc wifi enable; else adb shell svc wifi disable; fi
      - name: Upload Android route validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-route-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/espana-outdoor-route-logcat.txt
          if-no-files-found: ignore
