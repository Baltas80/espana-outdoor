name: Android staging

on:
  workflow_dispatch:
    inputs:
      mapbox_style_variant:
        description: "Mapbox style used only by this staging run; production default remains Outdoors."
        required: true
        type: choice
        options:
          - outdoors-v12
          - standard
        default: outdoors-v12
      android_view_mode:
        description: "Android platform-view mode for this staging run; production default remains Hybrid Composition/SurfaceView."
        required: true
        type: choice
        options:
          - hybrid-surface
          - virtual-texture
        default: hybrid-surface
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/staging-android.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

concurrency:
  group: android-staging-${{ github.ref }}
  # Keep an active emulator smoke and its evidence; newer PR commits queue behind it.
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ENV: staging
  VALHALLA_BASE_URL: https://routing.espanaoutdoor.es
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  COMMUNITY_API_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect
  MAPBOX_STYLE_URI: ${{ (inputs.mapbox_style_variant == 'standard' || (github.event_name == 'pull_request' && github.event.pull_request.number == 79)) && 'mapbox://styles/mapbox/standard' || 'mapbox://styles/mapbox/outdoors-v12' }}
  MAPBOX_ANDROID_VIEW_MODE: ${{ (inputs.android_view_mode == 'virtual-texture' || (github.event_name == 'pull_request' && github.event.pull_request.number == 79)) && 'virtual-texture' || 'hybrid-surface' }}
  MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 79) && 'vector' || 'none' }}

jobs:
  android-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      apk_built: ${{ steps.build_apk.outputs.built }}
    # Install staging previews side-by-side with the production package.
    # Never overwrite the user's installed app with a runner-specific debug signature.
    env:
      ANDROID_APPLICATION_ID: com.espanaoutdoors.espana_outdoors.iconspreview
      ANDROID_APP_AUTH_REDIRECT_SCHEME: com.espanaoutdoors
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in VALHALLA_BASE_URL SOURCE_GATEWAY_BASE_URL COMMUNITY_API_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"; test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done
          case "$MAPBOX_STYLE_URI" in
            mapbox://styles/mapbox/outdoors-v12|mapbox://styles/mapbox/standard) ;;
            *) echo "Unsupported MAPBOX_STYLE_URI"; exit 1 ;;
          esac
          case "$MAPBOX_ANDROID_VIEW_MODE" in
            hybrid-surface|virtual-texture) ;;
            *) echo "Unsupported MAPBOX_ANDROID_VIEW_MODE"; exit 1 ;;
          esac
          case "$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" in
            none|baseline|vector) ;;
            *) echo "Unsupported MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE"; exit 1 ;;
          esac
          if [[ "$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" != "none" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "MapWidget diagnostic styles are restricted to pull-request staging."
            exit 1
          fi
          echo "Mapbox staging style: $MAPBOX_STYLE_URI"
          echo "Mapbox Android view mode: $MAPBOX_ANDROID_VIEW_MODE"
          echo "MapWidget diagnostic style: $MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE"
      - name: Preflight Mapbox style and vector tile access
        if: env.MAPBOX_ACCESS_TOKEN != ''
        shell: bash
        run: python3 tool/preflight_mapbox_tiles.py --style-uri "$MAPBOX_STYLE_URI"
      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/*.gradle*
            android/app/*.gradle*
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "$RUNNER_TEMP/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "$RUNNER_TEMP/widget_test.dart"; fi
          flutter --version
          flutter create . --platforms=android --org com.espanaoutdoors --overwrite
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/pubspec.lock" pubspec.lock
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          if [[ -f "$RUNNER_TEMP/analysis_options.yaml" ]]; then cp "$RUNNER_TEMP/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "$RUNNER_TEMP/widget_test.dart" ]]; then cp "$RUNNER_TEMP/widget_test.dart" test/widget_test.dart; fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android
      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android
      - name: Resolve dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          echo "pubspec_lock_unchanged=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage
          python3 tool/test_preflight_mapbox_tiles.py
      - name: Build Android staging APK
        id: build_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_DOWNLOADS_TOKEN (Downloads:Read)."
              exit 1
            fi
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK build skipped: Dependabot cannot access MAPBOX_DOWNLOADS_TOKEN. Analysis and tests ran; no Android artifact was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapbox_runtime="available"
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_ACCESS_TOKEN; runtime staging validation cannot run."
              exit 1
            fi
            mapbox_runtime="unavailable"
            echo "::warning::Dependabot cannot access MAPBOX_ACCESS_TOKEN. Building a compile-only APK; Mapbox rendering and runtime routing are NOT validated."
            {
              echo "### Android staging: compile-only"
              echo "Dependabot has no MAPBOX_ACCESS_TOKEN. Flutter analysis, tests and APK compilation run, but map rendering and runtime routing are not validated by this artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android staging: runtime token available" >> "$GITHUB_STEP_SUMMARY"
          fi
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="$MAPBOX_STYLE_URI" \
            --dart-define=MAPBOX_ANDROID_VIEW_MODE="$MAPBOX_ANDROID_VIEW_MODE" \
            --dart-define=MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE="$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" \
            --dart-define=MAPBOX_TILE_STORE_USAGE_MODE=default \
            --dart-define=MAPBOX_SNAPSHOTTER_DIAGNOSTICS=false \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=COMMUNITY_API_BASE_URL="$COMMUNITY_API_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt_path"
          badging="$("$aapt_path" dump badging "$apk")"
          application_id="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_name="$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          test -n "$application_id"
          test -n "$version_code"
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_commit="${{ github.event.pull_request.head.sha }}"
          fi
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f1)"
          apk_size_bytes="$(stat -c '%s' "$apk")"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          mkdir -p build
          {
            echo "profile=staging"
            echo "build_variant=release"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "app_version=$app_version"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$apk_size_bytes"
            echo "apk_sha256=$apk_sha256"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=$flutter_version"
            echo "flutter_renderer=impeller-default"
            echo "impeller_enabled=default"
            echo "mapbox_runtime_token=$mapbox_runtime"
            echo "mapbox_style_uri=$MAPBOX_STYLE_URI"
            echo "mapbox_android_view_mode=$MAPBOX_ANDROID_VIEW_MODE"
            echo "mapbox_map_widget_diagnostic_style=$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE"
            echo "mapbox_tile_store_usage_mode=default"
            echo "mapbox_snapshotter_diagnostics=false"
            if [[ "$mapbox_runtime" == "available" ]]; then
              echo "validation_scope=runtime-capable-artifact"
            else
              echo "validation_scope=compile-only-no-mapbox-runtime"
            fi
          } > build/android-staging-validation.txt
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        if: steps.build_apk.outputs.built == 'true'
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          manifest="build/android-staging-validation.txt"
          test -n "$apk"
          test -s "$manifest"
          python3 tool/verify_android_release.py --apk "$apk"
          expected_sha="$(sed -n 's/^apk_sha256=//p' "$manifest")"
          actual_sha="$(sha256sum "$apk" | cut -d ' ' -f1)"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          grep -Fxq "workflow_commit=$GITHUB_SHA" "$manifest"
          grep -Fxq "mapbox_android_view_mode=$MAPBOX_ANDROID_VIEW_MODE" "$manifest"
          grep -Fxq "mapbox_map_widget_diagnostic_style=$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" "$manifest"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            grep -Fxq "source_commit=${{ github.event.pull_request.head.sha }}" "$manifest"
          fi
      - name: Preserve verified primary Android staging APK
        id: preserve_primary_apk
        if: success() && steps.build_apk.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          primary_dir="$RUNNER_TEMP/primary-build"
          mkdir -p "$primary_dir"
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          manifest="build/android-staging-validation.txt"
          test -s "$apk"
          test -s "$manifest"
          cp "$apk" "$primary_dir/app-release.apk"
          cp "$manifest" "$primary_dir/android-staging-validation.txt"
          expected_sha="$(sed -n 's/^apk_sha256=//p' "$manifest")"
          actual_sha="$(sha256sum "$primary_dir/app-release.apk" | cut -d ' ' -f1)"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          echo "primary_apk_preserved=$primary_dir/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Mapbox Skia comparison APK (Impeller disabled)
        id: build_skia_apk
        continue-on-error: true
        if: success() && steps.build_apk.outputs.built == 'true' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != '' && github.event_name == 'pull_request' && github.event.pull_request.number == 79 && env.MAPBOX_STYLE_URI == 'mapbox://styles/mapbox/outdoors-v12'
        shell: bash
        run: |
          set -euo pipefail
          renderer_dir="$RUNNER_TEMP/skia-build"
          mkdir -p "$renderer_dir"

          # Flutter 3.47.5 rejects a custom output-directory flag. Build the
          # renderer comparison through the normal output path, then preserve it separately.
          # A clean prevents stale Dart defines from being reused.
          flutter clean
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          # Preserve the fully configured manifest after configure_mobile_native.py.
          # The Skia helper mutates it; the later TileStore build must restore this
          # exact CI manifest rather than the unconfigured repository template.
          manifest_backup="$RUNNER_TEMP/android-manifest-before-skia.xml"
          cp android/app/src/main/AndroidManifest.xml "$manifest_backup"
          test -s "$manifest_backup"
          python3 tool/prepare_android_skia_ab.py android/app/src/main/AndroidManifest.xml
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="$MAPBOX_STYLE_URI" \
            --dart-define=MAPBOX_ANDROID_VIEW_MODE=hybrid-surface \
            --dart-define=MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE="$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" \
            --dart-define=MAPBOX_TILE_STORE_USAGE_MODE=default \
            --dart-define=MAPBOX_SNAPSHOTTER_DIAGNOSTICS=false \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=COMMUNITY_API_BASE_URL="$COMMUNITY_API_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"

          renderer_apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$renderer_apk"
          python3 tool/verify_android_release.py --apk "$renderer_apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt_path"
          badging="$("$aapt_path" dump badging "$renderer_apk")"
          application_id="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_name="$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          test -n "$application_id"
          test -n "$version_code"
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_commit="${{ github.event.pull_request.head.sha }}"
          fi
          apk_sha256="$(sha256sum "$renderer_apk" | cut -d ' ' -f1)"
          apk_size_bytes="$(stat -c '%s' "$renderer_apk")"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          cp "$renderer_apk" "$renderer_dir/app-release.apk"
          {
            echo "profile=staging"
            echo "build_variant=release"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "app_version=$app_version"
            echo "apk_file=app-release.apk"
            echo "apk_size_bytes=$apk_size_bytes"
            echo "apk_sha256=$apk_sha256"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=$flutter_version"
            echo "flutter_renderer=skia-optout"
            echo "impeller_enabled=false"
            echo "mapbox_tile_store_usage_mode=default"
            echo "mapbox_snapshotter_diagnostics=false"
            echo "mapbox_runtime_token=available"
            echo "mapbox_downloads_token=available"
            echo "mapbox_style_uri=$MAPBOX_STYLE_URI"
            echo "mapbox_android_view_mode=hybrid-surface"
            echo "mapbox_map_widget_diagnostic_style=$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE"
            echo "validation_scope=runtime-capable-artifact"
          } > "$renderer_dir/android-staging-validation.txt"
          echo "renderer_apk_built=$renderer_dir/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Mapbox TileStore-disabled diagnostic APK
        id: build_tile_store_disabled_apk
        continue-on-error: true
        if: success() && steps.build_apk.outputs.built == 'true' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != '' && github.event_name == 'pull_request' && github.event.pull_request.number == 79
        shell: bash
        run: |
          set -euo pipefail
          tile_store_dir="$RUNNER_TEMP/tile-store-disabled-build"
          mkdir -p "$tile_store_dir"

          # Restore the exact native-configured manifest captured before the
          # Skia-only mutation. This preserves CI permissions/network policy while
          # returning the TileStore diagnostic to the default Impeller renderer.
          manifest_backup="$RUNNER_TEMP/android-manifest-before-skia.xml"
          if [[ ! -s "$manifest_backup" ]]; then
            # Standard-style runs skip the Skia build, so preserve the still-clean
            # CI-configured manifest here before the TileStore-only mutation.
            cp android/app/src/main/AndroidManifest.xml "$manifest_backup"
          fi
          test -s "$manifest_backup"
          cp "$manifest_backup" android/app/src/main/AndroidManifest.xml
          cmp -s "$manifest_backup" android/app/src/main/AndroidManifest.xml

          # Flutter 3.47.5 rejects a custom output-directory flag. Build the
          # TileStore-disabled diagnostic through the normal output path, then preserve it separately.
          # A clean prevents stale Dart defines from being reused.
          flutter clean
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="$MAPBOX_STYLE_URI" \
            --dart-define=MAPBOX_ANDROID_VIEW_MODE="$MAPBOX_ANDROID_VIEW_MODE" \
            --dart-define=MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE="$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE" \
            --dart-define=MAPBOX_TILE_STORE_USAGE_MODE=disabled \
            --dart-define=MAPBOX_SNAPSHOTTER_DIAGNOSTICS=false \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=COMMUNITY_API_BASE_URL="$COMMUNITY_API_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"

          diagnostic_apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$diagnostic_apk"
          python3 tool/verify_android_release.py --apk "$diagnostic_apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt_path"
          badging="$("$aapt_path" dump badging "$diagnostic_apk")"
          application_id="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_name="$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          test -n "$application_id"
          test -n "$version_code"
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_commit="${{ github.event.pull_request.head.sha }}"
          fi
          apk_sha256="$(sha256sum "$diagnostic_apk" | cut -d ' ' -f1)"
          apk_size_bytes="$(stat -c '%s' "$diagnostic_apk")"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          cp "$diagnostic_apk" "$tile_store_dir/app-release.apk"
          {
            echo "profile=staging"
            echo "build_variant=release"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "app_version=$app_version"
            echo "apk_file=app-release.apk"
            echo "apk_size_bytes=$apk_size_bytes"
            echo "apk_sha256=$apk_sha256"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=$flutter_version"
            echo "flutter_renderer=impeller-default"
            echo "impeller_enabled=default"
            echo "mapbox_tile_store_usage_mode=disabled"
            echo "mapbox_snapshotter_diagnostics=false"
            echo "mapbox_runtime_token=available"
            echo "mapbox_downloads_token=available"
            echo "mapbox_style_uri=$MAPBOX_STYLE_URI"
            echo "mapbox_android_view_mode=$MAPBOX_ANDROID_VIEW_MODE"
            echo "mapbox_map_widget_diagnostic_style=$MAPBOX_MAP_WIDGET_DIAGNOSTIC_STYLE"
            echo "validation_scope=diagnostic-only-tile-store-disabled"
          } > "$tile_store_dir/android-staging-validation.txt"
          echo "diagnostic_apk_built=$tile_store_dir/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android staging APK
        if: success() && steps.build_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-staging-apk
          path: |
            ${{ runner.temp }}/primary-build/app-release.apk
            ${{ runner.temp }}/primary-build/android-staging-validation.txt
          if-no-files-found: error
      - name: Upload Mapbox Skia A/B APK
        if: success() && steps.build_skia_apk.outcome == 'success'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: mapbox-skia-ab-apk
          path: |
            ${{ runner.temp }}/skia-build/app-release.apk
            ${{ runner.temp }}/skia-build/android-staging-validation.txt
          if-no-files-found: error
      - name: Upload Mapbox TileStore-disabled diagnostic APK
        if: success() && steps.build_tile_store_disabled_apk.outcome == 'success'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: mapbox-tile-store-disabled-apk
          path: |
            ${{ runner.temp }}/tile-store-disabled-build/app-release.apk
            ${{ runner.temp }}/tile-store-disabled-build/android-staging-validation.txt
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        id: kvm_setup
        if: success() && steps.build_apk.outputs.built == 'true' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'ERROR: /dev/kvm is not available on this runner.'
            exit 1
          fi
      - name: Android map native smoke
        id: android_map_smoke
        # PR #79 runs the primary Standard APK plus a TileStore-disabled diagnostic.
        # Each smoke is bounded to 20 minutes; allow both and a bounded emulator boot.
        timeout-minutes: 55
        # Preserve the runner long enough to upload diagnostics before enforcing
        # the failure in a separate always() gate below.
        continue-on-error: true
        env:
          ANDROID_EMULATOR_CI: "true"
        if: success() && steps.build_apk.outputs.built == 'true' && steps.kvm_setup.outcome == 'success' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash tool/smoke_android_map_ab.sh "$RUNNER_TEMP" "$MAPBOX_STYLE_URI"
      - name: Upload Android map smoke evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-map-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/primary/espana-outdoor-map-logcat.txt
            ${{ runner.temp }}/primary/espana-mapbox-diagnostics.txt
            ${{ runner.temp }}/primary/espana-window.xml
            ${{ runner.temp }}/primary/espana-window-post-map.xml
            ${{ runner.temp }}/primary/espana-system-dialog.xml
            ${{ runner.temp }}/primary/espana-map-page-check.txt
            ${{ runner.temp }}/primary/espana-outdoor-map.png
            ${{ runner.temp }}/primary/espana-mapbox-snapshotter.png
            ${{ runner.temp }}/primary/espana-mapbox-snapshotter-vector.png
            ${{ runner.temp }}/skia/espana-outdoor-map-logcat.txt
            ${{ runner.temp }}/skia/espana-mapbox-diagnostics.txt
            ${{ runner.temp }}/skia/espana-window.xml
            ${{ runner.temp }}/skia/espana-window-post-map.xml
            ${{ runner.temp }}/skia/espana-system-dialog.xml
            ${{ runner.temp }}/skia/espana-map-page-check.txt
            ${{ runner.temp }}/skia/espana-outdoor-map.png
            ${{ runner.temp }}/skia/espana-mapbox-snapshotter.png
            ${{ runner.temp }}/skia/espana-mapbox-snapshotter-vector.png
            ${{ runner.temp }}/tile-store-disabled/espana-outdoor-map-logcat.txt
            ${{ runner.temp }}/tile-store-disabled/espana-mapbox-diagnostics.txt
            ${{ runner.temp }}/tile-store-disabled/espana-window.xml
            ${{ runner.temp }}/tile-store-disabled/espana-window-post-map.xml
            ${{ runner.temp }}/tile-store-disabled/espana-system-dialog.xml
            ${{ runner.temp }}/tile-store-disabled/espana-map-page-check.txt
            ${{ runner.temp }}/tile-store-disabled/espana-outdoor-map.png
            ${{ runner.temp }}/tile-store-disabled/espana-mapbox-snapshotter.png
            ${{ runner.temp }}/tile-store-disabled/espana-mapbox-snapshotter-vector.png
          if-no-files-found: ignore
      - name: Require Android map native smoke
        if: always() && steps.build_apk.outputs.built == 'true' && steps.kvm_setup.outcome == 'success' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.android_map_smoke.outcome }}" != "success" ]]; then
            echo "::error::Android map native smoke failed; inspect the uploaded android-map-smoke artifact."
            exit 1
          fi
      - name: Require Mapbox Skia A/B APK
        if: always() && steps.build_skia_apk.outcome != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.number == 79 && env.MAPBOX_STYLE_URI == 'mapbox://styles/mapbox/outdoors-v12'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.build_skia_apk.outcome }}" != "success" ]]; then
            echo "::error::Mapbox Skia/Impeller renderer build failed; inspect the build step output."
            exit 1
          fi
          renderer_apk="$RUNNER_TEMP/skia-build/app-release.apk"
          renderer_manifest="$RUNNER_TEMP/skia-build/android-staging-validation.txt"
          test -s "$renderer_apk"
          test -s "$renderer_manifest"
          expected_sha="$(sed -n 's/^apk_sha256=//p' "$renderer_manifest")"
          actual_sha="$(sha256sum "$renderer_apk" | cut -d ' ' -f1)"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          grep -Fxq "mapbox_style_uri=$MAPBOX_STYLE_URI" "$renderer_manifest"
          grep -Fxq "mapbox_android_view_mode=hybrid-surface" "$renderer_manifest"
          grep -Fxq "flutter_renderer=skia-optout" "$renderer_manifest"
          grep -Fxq "impeller_enabled=false" "$renderer_manifest"

      - name: Require Mapbox TileStore-disabled diagnostic APK
        if: always() && steps.build_tile_store_disabled_apk.outcome != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.number == 79
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.build_tile_store_disabled_apk.outcome }}" != "success" ]]; then
            echo "::error::Mapbox TileStore-disabled diagnostic APK build failed."
            exit 1
          fi
          diagnostic_apk="$RUNNER_TEMP/tile-store-disabled-build/app-release.apk"
          diagnostic_manifest="$RUNNER_TEMP/tile-store-disabled-build/android-staging-validation.txt"
          primary_manifest="$RUNNER_TEMP/primary-build/android-staging-validation.txt"
          test -s "$diagnostic_apk"
          test -s "$diagnostic_manifest"
          test -s "$primary_manifest"
          expected_sha="$(sed -n 's/^apk_sha256=//p' "$diagnostic_manifest")"
          actual_sha="$(sha256sum "$diagnostic_apk" | cut -d ' ' -f1)"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          for key in application_id version_code source_commit mapbox_style_uri mapbox_android_view_mode mapbox_map_widget_diagnostic_style; do
            expected="$(sed -n "s/^${key}=//p" "$primary_manifest" | head -n 1)"
            actual="$(sed -n "s/^${key}=//p" "$diagnostic_manifest" | head -n 1)"
            test -n "$expected"
            test "$expected" = "$actual"
          done
          grep -Fxq "flutter_renderer=impeller-default" "$diagnostic_manifest"
          grep -Fxq "impeller_enabled=default" "$diagnostic_manifest"
          grep -Fxq "mapbox_tile_store_usage_mode=disabled" "$diagnostic_manifest"
          grep -Fxq "validation_scope=diagnostic-only-tile-store-disabled" "$diagnostic_manifest"

