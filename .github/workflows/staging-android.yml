name: Android staging

on:
  workflow_dispatch:
    inputs:
      mapbox_style_variant:
        description: "Mapbox style used only by this staging run; production default remains Outdoors."
        required: true
        type: choice
        options:
          - outdoors-v12
          - standard
        default: outdoors-v12
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/staging-android.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

concurrency:
  group: android-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ENV: staging
  VALHALLA_BASE_URL: https://routing.espanaoutdoor.es
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  COMMUNITY_API_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect
  MAPBOX_STYLE_URI: ${{ inputs.mapbox_style_variant == 'standard' && 'mapbox://styles/mapbox/standard' || 'mapbox://styles/mapbox/outdoors-v12' }}

jobs:
  android-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      apk_built: ${{ steps.build_apk.outputs.built }}
    # Install staging previews side-by-side with the production package.
    # Never overwrite the user's installed app with a runner-specific debug signature.
    env:
      ANDROID_APPLICATION_ID: com.espanaoutdoors.espana_outdoors.iconspreview
      ANDROID_APP_AUTH_REDIRECT_SCHEME: com.espanaoutdoors
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in VALHALLA_BASE_URL SOURCE_GATEWAY_BASE_URL COMMUNITY_API_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"; test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done
          case "$MAPBOX_STYLE_URI" in
            mapbox://styles/mapbox/outdoors-v12|mapbox://styles/mapbox/standard) ;;
            *) echo "Unsupported MAPBOX_STYLE_URI"; exit 1 ;;
          esac
          echo "Mapbox staging style: $MAPBOX_STYLE_URI"
      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          if [[ -f analysis_options.yaml ]]; then cp analysis_options.yaml "$RUNNER_TEMP/analysis_options.yaml"; fi
          if [[ -f test/widget_test.dart ]]; then cp test/widget_test.dart "$RUNNER_TEMP/widget_test.dart"; fi
          flutter --version
          flutter create . --platforms=android --org com.espanaoutdoors --overwrite
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/pubspec.lock" pubspec.lock
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          if [[ -f "$RUNNER_TEMP/analysis_options.yaml" ]]; then cp "$RUNNER_TEMP/analysis_options.yaml" analysis_options.yaml; fi
          if [[ -f "$RUNNER_TEMP/widget_test.dart" ]]; then cp "$RUNNER_TEMP/widget_test.dart" test/widget_test.dart; fi
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android
      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android
      - name: Resolve dependencies from committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          echo "pubspec_lock_unchanged=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage
      - name: Build Android staging APK
        id: build_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_DOWNLOADS_TOKEN (Downloads:Read)."
              exit 1
            fi
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK build skipped: Dependabot cannot access MAPBOX_DOWNLOADS_TOKEN. Analysis and tests ran; no Android artifact was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapbox_runtime="available"
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_ACCESS_TOKEN; runtime staging validation cannot run."
              exit 1
            fi
            mapbox_runtime="unavailable"
            echo "::warning::Dependabot cannot access MAPBOX_ACCESS_TOKEN. Building a compile-only APK; Mapbox rendering and runtime routing are NOT validated."
            {
              echo "### Android staging: compile-only"
              echo "Dependabot has no MAPBOX_ACCESS_TOKEN. Flutter analysis, tests and APK compilation run, but map rendering and runtime routing are not validated by this artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android staging: runtime token available" >> "$GITHUB_STEP_SUMMARY"
          fi
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="$MAPBOX_STYLE_URI" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=COMMUNITY_API_BASE_URL="$COMMUNITY_API_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt_path"
          badging="$("$aapt_path" dump badging "$apk")"
          application_id="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          version_name="$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$badging" | head -n 1)"
          test -n "$application_id"
          test -n "$version_code"
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_commit="${{ github.event.pull_request.head.sha }}"
          fi
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f1)"
          apk_size_bytes="$(stat -c '%s' "$apk")"
          flutter_version="$(flutter --version | head -n 1)"
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          mkdir -p build
          {
            echo "profile=staging"
            echo "build_variant=release"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "app_version=$app_version"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$apk_size_bytes"
            echo "apk_sha256=$apk_sha256"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=$flutter_version"
            echo "mapbox_runtime_token=$mapbox_runtime"
            echo "mapbox_style_uri=$MAPBOX_STYLE_URI"
            if [[ "$mapbox_runtime" == "available" ]]; then
              echo "validation_scope=runtime-capable-artifact"
            else
              echo "validation_scope=compile-only-no-mapbox-runtime"
            fi
          } > build/android-staging-validation.txt
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        if: steps.build_apk.outputs.built == 'true'
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          manifest="build/android-staging-validation.txt"
          test -n "$apk"
          test -s "$manifest"
          python3 tool/verify_android_release.py --apk "$apk"
          expected_sha="$(sed -n 's/^apk_sha256=//p' "$manifest")"
          actual_sha="$(sha256sum "$apk" | cut -d ' ' -f1)"
          test -n "$expected_sha"
          test "$expected_sha" = "$actual_sha"
          grep -Fxq "workflow_commit=$GITHUB_SHA" "$manifest"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            grep -Fxq "source_commit=${{ github.event.pull_request.head.sha }}" "$manifest"
          fi
      - name: Upload Android staging APK
        if: success() && steps.build_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-staging-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/android-staging-validation.txt
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        id: kvm_setup
        if: success() && steps.build_apk.outputs.built == 'true' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'ERROR: /dev/kvm is not available on this runner.'
            exit 1
          fi
      - name: Android map native smoke
        id: android_map_smoke
        timeout-minutes: 25
        env:
          ANDROID_EMULATOR_CI: "true"
        if: success() && steps.build_apk.outputs.built == 'true' && steps.kvm_setup.outcome == 'success' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: timeout --foreground --signal=TERM --kill-after=150s 20m bash tool/smoke_android_map.sh build/app/outputs/flutter-apk/app-release.apk online
      - name: Upload Android map smoke evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-map-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/espana-outdoor-map-logcat.txt
            ${{ runner.temp }}/espana-mapbox-diagnostics.txt
            ${{ runner.temp }}/espana-window.xml
            ${{ runner.temp }}/espana-window-post-map.xml
            ${{ runner.temp }}/espana-outdoor-map.png
          if-no-files-found: ignore

