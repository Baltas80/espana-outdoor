name: Android staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'android/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'test/**'
      - 'android/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

concurrency:
  group: android-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: staging
  VALHALLA_BASE_URL: https://routing.espanaoutdoor.es
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  COMMUNITY_API_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect

jobs:
  android-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Install staging previews side-by-side with the production package.
    # Never overwrite the user's installed app with a runner-specific debug signature.
    env:
      ANDROID_APPLICATION_ID: com.espanaoutdoors.espana_outdoors.iconspreview
      ANDROID_APP_AUTH_REDIRECT_SCHEME: com.espanaoutdoors
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test Mapbox resource expiry patch
        run: python3 tool/test_patch_mapbox_resource_expiry.py
      - name: Test Android emulator network guard
        run: python3 tool/test_android_emulator_network_guard.py
      - name: Verify shared Mapbox TileStore mode
        run: python3 tool/test_mapbox_tile_store_mode.py
      - name: Test Mapbox runtime access preflight
        run: python3 tool/test_mapbox_runtime_access.py
      - name: Test Android map screenshot decoder
        run: python3 tool/verify_android_map_screenshot.py --self-test
      - name: Validate Android shell harness syntax
        run: bash -n tool/staging_android_route_integration.sh tool/smoke_android_map.sh tool/staging_android_emulator_validation.sh tool/ensure_android_emulator_online.sh
      - name: Verify Mapbox runtime style and vector tile access
        if: env.MAPBOX_ACCESS_TOKEN != '' && github.actor != 'dependabot[bot]'
        run: python3 tool/verify_mapbox_runtime_access.py
      - name: Report Mapbox runtime preflight skipped for Dependabot
        if: env.MAPBOX_ACCESS_TOKEN == '' && github.actor == 'dependabot[bot]'
        run: echo "Mapbox runtime access was not tested because Dependabot does not receive runtime secrets."
      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in VALHALLA_BASE_URL SOURCE_GATEWAY_BASE_URL COMMUNITY_API_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"; test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done
          test -n "${OIDC_CLIENT_ID:-}"
          test -n "${OIDC_REDIRECT_URI:-}"
      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Verify committed Android native project
        run: python3 tool/verify_mobile_native.py --platform android
      - name: Install Android NDK 28.2.13676358
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set}}"
          sdkmanager_path="$(command -v sdkmanager || find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$sdk_root" --install "ndk;28.2.13676358"
          test -f "$sdk_root/ndk/28.2.13676358/source.properties"
      - name: Dependencies (enforce committed lockfile)
        run: flutter pub get --enforce-lockfile
      - name: Patch Mapbox resource expiry sentinel
        run: python3 tool/patch_mapbox_resource_expiry.py
      - name: Verify Mapbox Flutter dependency lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/mapbox-offline-routing-final-20261114'
        run: python3 tool/verify_mapbox_lock.py
      - name: Export resolved Pub lockfile for dependency audit
        if: success()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: resolved-pubspec-lock-staging-${{ github.run_id }}
          path: pubspec.lock
          if-no-files-found: error
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage
      - name: Build Android staging APK
        id: build_apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_DOWNLOADS_TOKEN (Downloads:Read)."
              exit 1
            fi
            {
              echo "profile=staging"
              echo "validation_scope=analysis-tests-only-no-mapbox-maven"
              echo "mapbox_runtime_token=unavailable"
              echo "commit=$GITHUB_SHA"
            } > build/android-staging-validation.txt
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "Android APK build skipped: Dependabot cannot access MAPBOX_DOWNLOADS_TOKEN. Analysis and tests ran; no Android artifact was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mapbox_runtime="available"
          if [[ -z "${MAPBOX_ACCESS_TOKEN:-}" ]]; then
            if [[ "${GITHUB_ACTOR}" != "dependabot[bot]" ]]; then
              echo "::error::Missing MAPBOX_ACCESS_TOKEN; runtime staging validation cannot run."
              exit 1
            fi
            mapbox_runtime="unavailable"
            echo "::warning::Dependabot cannot access MAPBOX_ACCESS_TOKEN. Building a compile-only APK; map rendering and runtime routing are NOT validated."
          fi

          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=COMMUNITY_API_BASE_URL="$COMMUNITY_API_BASE_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"
          {
            echo "profile=staging"
            echo "mapbox_runtime_token=$mapbox_runtime"
            if [[ "$mapbox_runtime" == "available" ]]; then
              echo "validation_scope=runtime-capable-artifact"
            else
              echo "validation_scope=compile-only-no-mapbox-runtime"
            fi
            echo "mapbox_downloads_token=available"
            echo "commit=$GITHUB_SHA"
          } > build/android-staging-validation.txt
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Verify APK and write device-validation manifest
        if: steps.build_apk.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 tool/verify_android_release.py --apk "$apk"
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          application_id="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test -n "$application_id"
          test -n "$version_code"
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          source_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "apk_sha256=$apk_sha256"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "source_commit=$source_commit"
          } >> build/android-staging-validation.txt
          echo "verified_apk_sha256=$apk_sha256"
          echo "verified_application_id=$application_id"
          echo "verified_version_code=$version_code"
          echo "verified_source_commit=$source_commit"
      - name: Upload Android staging artifact and validation scope
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-staging-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/android-staging-validation.txt
          if-no-files-found: warn
      - name: Enable KVM for Android emulator
        id: kvm_setup
        if: success() && steps.build_apk.outputs.built == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'ERROR: /dev/kvm is not available on this runner.'
            exit 1
          fi
      - name: Android map and routing validation
        id: android_emulator_validation
        if: success() && steps.build_apk.outputs.built == 'true' && steps.kvm_setup.outcome == 'success' && env.MAPBOX_ACCESS_TOKEN != '' && env.MAPBOX_DOWNLOADS_TOKEN != ''
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          ANDROID_EMULATOR_CI: "true"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -netdelay none -netspeed full
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tool/staging_android_emulator_validation.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Android route validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-route-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/espana-outdoor-route-logcat.txt
            ${{ runner.temp }}/espana-outdoor-route-test-output.txt
            ${{ runner.temp }}/espana-outdoor-offline-map.png
          if-no-files-found: ignore
      - name: Upload Android map smoke evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: android-map-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/espana-outdoor-map-logcat.txt
            ${{ runner.temp }}/espana-window.xml
            ${{ runner.temp }}/espana-window-post-map.xml
            ${{ runner.temp }}/espana-outdoor-map.png
            ${{ runner.temp }}/espana-outdoor-activity.txt
          if-no-files-found: ignore
