name: Security baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios --org com.espanaoutdoors
      - run: flutter pub get
      - name: Outdated dependency report
        run: flutter pub outdated

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: espana-outdoors-sbom.cdx.json
          output-file: espana-outdoors-sbom.cdx.json

  github-actions-codeql:
    name: CodeQL - GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:actions

  go-codeql:
    name: CodeQL - Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4.39.1
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:go

  web-og-image-policy:
    name: OG image policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate first-party OG images
        run: python3 tool/check_og_image_policy.py

  dart-static-analysis:
    name: Dart static analysis (CodeQL unavailable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
