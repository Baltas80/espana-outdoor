name: Map production catalog smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-catalog:
    runs-on: ubuntu-24.04
    environment: maps-production
    env:
      OFFLINE_CATALOG_URL: ${{ vars.OFFLINE_CATALOG_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate production catalog endpoint
        run: |
          set -euo pipefail
          : "${OFFLINE_CATALOG_URL:?OFFLINE_CATALOG_URL is required in maps-production}"
          case "${OFFLINE_CATALOG_URL}" in
            https://*) ;;
            *) echo "OFFLINE_CATALOG_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Validate catalog and PMTiles object
        run: bash ops/offline/verify-map-catalog.sh
