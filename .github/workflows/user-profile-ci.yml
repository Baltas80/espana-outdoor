name: User Profile API CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
    paths:
      - "services/user-profile/**"
      - ".github/workflows/user-profile-ci.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "services/user-profile/**"
      - ".github/workflows/user-profile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/user-profile/go.mod
          cache-dependency-path: services/user-profile/go.sum
      - name: Check formatting
        working-directory: services/user-profile
        run: |
          test -z "$(gofmt -l cmd)"
      - name: Download dependencies
        working-directory: services/user-profile
        run: go mod download
      - name: Unit tests
        working-directory: services/user-profile
        run: go test ./...
      - name: Static analysis
        working-directory: services/user-profile
        run: go vet ./...
