name: Deploy España Outdoor Web

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Inject Shopify Storefront configuration
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
        run: |
          printf 'window.ESPANA_OUTDOOR_SHOPIFY_STOREFRONT_TOKEN=%s;\n' "$(python3 -c 'import json,os; print(json.dumps(os.environ["SHOPIFY_STOREFRONT_TOKEN"]))')" > site/shopify-config.js

      - name: Build official route catalog
        run: python3 scripts/build-route-catalog.py

      - name: Sync MITECO open-data catalog
        run: python3 scripts/build-miteco-catalog.py

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
