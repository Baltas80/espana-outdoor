name: Deploy España Outdoor Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Inject public Shopify Storefront configuration
        env:
          SHOPIFY_STOREFRONT_PUBLIC_TOKEN: ${{ vars.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
        run: |
          printf 'window.ESPANA_OUTDOOR_SHOPIFY_STOREFRONT_TOKEN=%s;\n' "$(python3 -c 'import json,os; print(json.dumps(os.environ["SHOPIFY_STOREFRONT_PUBLIC_TOKEN"]))')" > site/shopify-config.js

      - name: Build official route catalog
        run: python3 scripts/build-route-catalog.py

      - name: Sync MITECO open-data catalog
        run: python3 scripts/build-miteco-catalog.py

      - name: Upload web artifact
        id: upload_pages
        # deploy-pages@v5.0.1 currently uses @actions/artifact 2.x; keep the
        # Pages uploader on upload-artifact v4 until the deploy action updates
        # its artifact client to the v7 protocol.
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "./site"

      - name: Verify Pages artifact upload output
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload_pages.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
