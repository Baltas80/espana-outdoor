name: espana_outdoors
description: España Outdoor - naturaleza, rutas, seguridad, mascotas, fauna y conservación.
publish_to: "none"
version: 0.1.0+5

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  cupertino_icons: ^2.0.0
  latlong2: ^0.10.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  geolocator: ^14.1.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  gpx: ^2.3.0
  hive_ce_flutter: ^2.4.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  crypto: ^3.0.7
  purchases_flutter: ^10.14.0
  purchases_ui_flutter: ^10.14.0
  background_downloader: ^9.6.3
  flutter_appauth: ^12.1.0
  sentry_flutter: ^10.2.0
  battery_plus: ^7.1.1
  sensors_plus: ^7.1.0
  flutter_device_compass: ^2.2.0
  mapbox_maps_flutter: 3.33.0

# Evita que Pub seleccione 3.33.1, cuya configuración Gradle falla en Android.
dependency_overrides:
  mapbox_maps_flutter_mobile: 3.33.0
  mapbox_maps_flutter_platform_interface: 3.33.0
  mapbox_maps_flutter_web: 3.33.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/maps/
    - assets/testing/
    - assets/emergency/
    - assets/backgrounds/
    - assets/visuals/
    - assets/landscapes/
    - assets/flora_fauna/flora/
    - assets/flora_fauna/fauna/
    - assets/images/routes/
