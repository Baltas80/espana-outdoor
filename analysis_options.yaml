include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    use_build_context_synchronously: warning
  exclude:
    - build/**
    - android/**
    # Archived patch payload: source files are copied into lib/ by APLICAR.ps1.
    # Do not analyze this staging copy as part of the application package.
    - espana_outdoor_backtrack_patch/**

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_build_context_synchronously: true
