services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: espana_outdoor
      POSTGRES_USER: espana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espana -d espana_outdoor"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HTTP_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  source-gateway:
    build:
      context: ../services/source-gateway
    restart: unless-stopped
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?set in .env}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set in .env}
      AEMET_API_KEY: ${AEMET_API_KEY:?set in .env}
      AEMET_API_KEY_EXPIRES_AT: ${AEMET_API_KEY_EXPIRES_AT:?set in .env}
      AEMET_BASE_URL: ${AEMET_BASE_URL:-https://opendata.aemet.es/opendata/api}
      PORT: 8080
      CACHE_FRESH_TTL: ${CACHE_FRESH_TTL:-10m}
      CACHE_AGING_TTL: ${CACHE_AGING_TTL:-10m}
      CACHE_STALE_TTL: ${CACHE_STALE_TTL:-40m}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-2}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      ALLOW_HTTP_DEV: "false"
    depends_on:
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  user-profile:
    build:
      context: ../services/user-profile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://espana:${POSTGRES_PASSWORD}@postgres:5432/espana_outdoor?sslmode=disable
      OIDC_ISSUER: ${PROFILE_OIDC_ISSUER:-${OIDC_ISSUER:-http://keycloak:8080/realms/espana-outdoor}}
      OIDC_AUDIENCE: ${PROFILE_OIDC_AUDIENCE:-espana-outdoor-api}
      CORS_ALLOWED_ORIGINS: ${PROFILE_CORS_ALLOWED_ORIGINS:-https://espanaoutdoor.es,https://www.espanaoutdoor.es}
      PORT: 8080
      ALLOW_HTTP_DEV: ${ALLOW_HTTP_DEV:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  rescue-link:
    build:
      context: ../services/rescue-link
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://espana:${POSTGRES_PASSWORD}@postgres:5432/espana_outdoor?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/espana-outdoor}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-espana-outdoors-mobile}
      PUBLIC_SHARE_BASE_URL: ${PUBLIC_SHARE_BASE_URL:?set in .env}
      LOCATION_ENCRYPTION_KEY: ${LOCATION_ENCRYPTION_KEY:?set in .env}
      RESCUE_MAX_TTL: ${RESCUE_MAX_TTL:-15m}
      RESCUE_RETENTION: ${RESCUE_RETENTION:-24h}
      RESCUE_CAPABILITY_TTL: ${RESCUE_CAPABILITY_TTL:-5m}
      RESCUE_MAX_RESPONDERS: ${RESCUE_MAX_RESPONDERS:-5}
      RESCUE_RATE_LIMIT_RPS: ${RESCUE_RATE_LIMIT_RPS:-2}
      RESCUE_RATE_LIMIT_BURST: ${RESCUE_RATE_LIMIT_BURST:-10}
      ENABLE_HSTS: "true"
      ALLOW_HTTP_DEV: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://espana:${POSTGRES_PASSWORD}@postgres:5432/espana_outdoor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data/tiles:/data/tiles:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ../ops/valhalla/data:/data/valhalla
      - ../ops/valhalla/config:/config:ro
    command: ["valhalla_service", "/config/valhalla.json", "2"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nats:
    image: nats:2.15.0-alpine
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  nats_data:
  prometheus_data:
  grafana_data:
