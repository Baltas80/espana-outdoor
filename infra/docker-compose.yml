services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: espana_outdoor
      POSTGRES_USER: espana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espana -d espana_outdoor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  source-gateway:
    build:
      context: ../services/source-gateway
    restart: unless-stopped
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?set in .env}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set in .env}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:?set in .env}
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      AEMET_API_KEY: ${AEMET_API_KEY:?set in .env}
      AEMET_API_KEY_EXPIRES_AT: ${AEMET_API_KEY_EXPIRES_AT:?set in .env}
      AEMET_BASE_URL: ${AEMET_BASE_URL:-https://opendata.aemet.es/opendata/api}
      PORT: 8080
      CACHE_FRESH_TTL: ${CACHE_FRESH_TTL:-10m}
      CACHE_AGING_TTL: ${CACHE_AGING_TTL:-10m}
      CACHE_STALE_TTL: ${CACHE_STALE_TTL:-40m}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-2}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      ALLOW_HTTP_DEV: ${ALLOW_HTTP_DEV:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  rescue-link:
    build:
      context: ../services/rescue-link
    restart: unless-stopped
    # Use the same configurable DSN as Source Gateway; production must use TLS.
    DATABASE_URL: ${DATABASE_URL:?set in .env}
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/espana-outdoor}
      RESCUE_LINK_OIDC_AUDIENCE: ${RESCUE_LINK_OIDC_AUDIENCE:?set in .env}
      PUBLIC_SHARE_BASE_URL: ${PUBLIC_SHARE_BASE_URL:?set in .env}
      LOCATION_ENCRYPTION_KEY: ${LOCATION_ENCRYPTION_KEY:?set in .env}
      RESCUE_MAX_TTL: ${RESCUE_MAX_TTL:-15m}
      RESCUE_RETENTION: ${RESCUE_RETENTION:-24h}
      RESCUE_CAPABILITY_TTL: ${RESCUE_CAPABILITY_TTL:-5m}
      RESCUE_MAX_RESPONDERS: ${RESCUE_MAX_RESPONDERS:-5}
      RESCUE_RATE_LIMIT_RPS: ${RESCUE_RATE_LIMIT_RPS:-2}
      RESCUE_RATE_LIMIT_BURST: ${RESCUE_RATE_LIMIT_BURST:-10}
      ENABLE_HSTS: "true"
      ALLOW_HTTP_DEV: ${ALLOW_HTTP_DEV:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
